<article class="card">
  <a class="img" href="{{ p.get_absolute_url }}" tabindex="-1" aria-hidden="true">{% if p.image %}<img src="{{ p.image.url }}" alt="" loading="lazy" draggable="false">{% else %}<span class="ph">{% if p.is_digital %}♪{% else %}✝{% endif %}</span>{% endif %}</a>
  <div class="body">
    <span class="tag {{ p.kind }}">{{ p.get_kind_display }}</span>
    <h3><a href="{{ p.get_absolute_url }}">{{ p.name }}</a></h3>
    <span class="price">{{ SHOP.CURRENCY_SYMBOL }}{{ p.price }}</span>
    {% if p.in_stock %}
    <form hx-post="{% url 'cart_add' p.pk %}" hx-target="#cart-badge" hx-swap="innerHTML" method="post" action="{% url 'cart_add' p.pk %}">{% csrf_token %}
      <button class="btn green sm" style="width:100%">Add to cart</button></form>
    {% else %}<em style="color:var(--danger)">Out of stock</em>{% endif %}
  </div>
</article>
